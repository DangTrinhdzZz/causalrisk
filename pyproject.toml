[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causalrisk"
version = "0.1.0"
description = "Protocol-governed evaluation of LLM causal reasoning orchestration"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/causalrisk"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
